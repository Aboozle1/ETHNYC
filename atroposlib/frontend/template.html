<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
    <style>
        body {{
            font-family: sans-serif;
            margin: 2em;
            color: #333;
        }}

        h1, h2, h3, h4 {{
            color: #111;
        }}

        details {{
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 1em;
            overflow: hidden; /* Ensures contained elements don't overflow rounded corners */
        }}

        summary {{
            padding: 1em;
            font-weight: bold;
            cursor: pointer;
            background-color: #f9f9f9;
        }}

        .group-content {{
            padding: 1em;
        }}
        
        .item {{
            border-top: 1px dashed #eee;
            padding-top: 1em;
            margin-top: 1em;
        }}
        
        .item:first-child {{
            border-top: none;
            margin-top: 0;
            padding-top: 0;
        }}

        .content-block {{
            margin-bottom: 10px;
        }}

        .metadata-block {{
            background-color: #f0f8ff; /* A light blue background */
            border: 1px solid #d0e0ff;
            border-radius: 5px;
            padding: 10px;
            margin-top: 10px;
        }}

        .metadata-block h4 {{
            margin-top: 0;
            color: #333;
        }}
        
        .word-list {{
            list-style: none;
            padding: 0;
        }}

        .word-list li {{
            display: inline-block;
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 3px 8px;
            border-radius: 15px;
            margin: 3px;
            font-size: 0.9em;
        }}

        .word-list span {{
            color: #555;
        }}

        pre {{
            background-color: #f4f4f4;
            padding: 1em;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }}

        .reward-positive {{
            border-left: 5px solid #4CAF50; /* Green */
            padding-left: 10px;
        }}
        .reward-negative {{
            border-left: 5px solid #F44336; /* Red */
            padding-left: 10px;
        }}
        .reward-zero {{
            border-left: 5px solid #ccc; /* Gray */
            padding-left: 10px;
        }}

        .item-header {{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }}

        .on-chain-badge {{
            background-color: #28a745; /* Green */
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
        }}
    </style>
</head>
<body>
    <h1>{title}</h1>
    {groups_html}
</body>
</html>
